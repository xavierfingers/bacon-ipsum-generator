  <script>
   function BaconIpsumGenerator() {
  $.ajax({
    url: "https://baconipsum.com/api/?type=meat-and-filler",
    method: 'GET',
    success: function main(paragraph) {
      let html ='<p>' + paragraph + '</p>';
      $('p').html(html);
    },
    error: function  main() {
      alert("ERROR: Bacon Ipsum failed.");
    }
  });
 }
</script>
<button onclick="BaconIpsumGenerator()">Generate Place holder text</button>
<h1>Bacon Ipsum generator.</h1>
